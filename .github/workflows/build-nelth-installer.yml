# Builds the real Nelth Browser Windows x64 installer on genuine CI runners.
#
# Pipeline (upstream's own split, installer/make-installer.sh header):
#   1. windows-latest: fetch the pinned framework (SHA-256 verified against
#      framework.lock), compile phi_client.dll with MSVC. This is the ONLY
#      step that truly needs Windows.
#   2. ubuntu-latest: package the ship tree with the Debian `nsis` package -
#      the installer host upstream's script was written for ("The Windows box
#      plays no part"). Produces NelthBrowserSetup.exe + its SHA-256.
#
# Nothing here fabricates a binary: every byte comes from the pinned
# framework release, the sources in this repository, and NSIS packing them.

name: Build Nelth Browser installer

on:
  workflow_dispatch:
  push:
    branches: [nelth-rebrand]

permissions:
  contents: read

jobs:
  build-client:
    name: phi_client.dll (Windows x64, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp the build number (upstream test-release flow)
        shell: bash
        run: |
          sed -i "s/#define PHI_WIN_VERSION_BUILD 0/#define PHI_WIN_VERSION_BUILD ${{ github.run_number }}/" client/phi_version.h
          grep "PHI_WIN_VERSION_BUILD" client/phi_version.h | head -1

      - name: Fetch the pinned framework (SHA-256 verified)
        shell: cmd
        run: python tools\fetch-framework.py --out out\Release --arch x64

      - name: Build phi_client.dll with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSROOT=%%i
          call "%VSROOT%\VC\Auxiliary\Build\vcvars64.bat"
          python build-client.py --compiler msvc

      - name: List the ship tree
        shell: bash
        run: |
          ls -la out/Release | head -30
          test -f out/Release/Phi.exe
          test -f out/Release/phi_client.dll
          test -f out/Release/chrome.dll
          test -f out/Release/resources/phi-client-resources.txt
          test -f out/Release/framework/framework.manifest

      - name: Upload the ship tree
        uses: actions/upload-artifact@v4
        with:
          name: ship-tree-x64
          path: out/Release/
          retention-days: 7
          if-no-files-found: error

  make-installer:
    name: NelthBrowserSetup.exe (NSIS on Linux)
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS (the host make-installer.sh is written for)
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis
          makensis -VERSION

      - name: Download the ship tree
        uses: actions/download-artifact@v4
        with:
          name: ship-tree-x64
          path: out/Release

      - name: Build NelthBrowserSetup.exe
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'PHI_WIN_VERSION_STRING \"([^\"]+)\"', open('client/phi_version.h').read()).group(1))")
          echo "version: $VERSION.${{ github.run_number }}"
          bash installer/make-installer.sh \
            --version "$VERSION" \
            --build-number "${{ github.run_number }}" \
            --arch x64 \
            --out out/Release \
            --no-sign \
            --no-telemetry

      - name: Collect the installer + SHA-256
        run: |
          mkdir -p nelth-artifact
          cp installer/dist/NelthBrowserSetup-*.exe nelth-artifact/NelthBrowserSetup.exe
          sha256sum nelth-artifact/NelthBrowserSetup.exe | tee nelth-artifact/NelthBrowserSetup.exe.SHA256
          ls -la nelth-artifact/

      - name: Upload NelthBrowserSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: NelthBrowserSetup
          path: nelth-artifact/
          retention-days: 30
          if-no-files-found: error
